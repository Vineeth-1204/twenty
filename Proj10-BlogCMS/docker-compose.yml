version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blog_cms_db
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpassword
      POSTGRES_DB: blogdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog_cms_backend
    environment:
      - DATABASE_URL=postgresql://bloguser:blogpassword@db:5432/blogdb
      - SECRET_KEY=production_docker_secret_key_987654321
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
